<!DOCTYPE html>

<html>

<head>
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>

    <div class="container p-0" style="width: 600px; border: 5px solid rgb(4, 255, 4); background-color: rgb(41, 0, 0);">

        <!-- Row 1 -->
        <div class="row m-0" style="height: 200px; border: 5px solid rgb(255, 188, 188);">

            <div class="col-6 col-md-4 p-0" style="border: 2px dotted rgb(38, 38, 43); background-color: teal;">
                Row1 col1
            </div>

            <div class="col-6 col-md-8 p-0" style="border: 2px dotted rgb(38, 38, 43); background-color: thistle;">
                Row1 col2
            </div>

        </div>

        <!-- Row 2 -->
        <div class="row m-0" style="height: 200px; border: 5px solid rgb(255, 188, 188);">

            <div class="col-6 col-md-4 offset-md-2 p-0" style="border: 2px dotted rgb(38, 38, 43); background-color: tomato;">
                Row2 col1
            </div>

            <div class="col-6 col-md-4 offset-md-2 p-0" style="border: 2px dotted rgb(38, 38, 43); background-color: turquoise;">
                Row2 col2
            </div>

        </div>

        <!-- Row 3 -->
        <div class="row m-0" style="height: 200px; border: 5px solid rgb(255, 188, 188);">

            <div class="col-6 col-md-4 offset-md-2 p-0" style="border: 2px dotted rgb(38, 38, 43); background-color: violet;">
                Row3 col1
            </div>

            <div class="col-6 col-md-4 p-0" style="border: 2px dotted rgb(38, 38, 43); background-color: yellowgreen;">
                Row3 col2
            </div>

        </div>

    </div>

    <script type="text/javascript" src="./script.js"></script>

</body>

</html>
